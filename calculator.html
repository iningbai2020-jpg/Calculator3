<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ningpro International Aesthetics</title>

<style>
:root{
  --bg:#F5F5F7;
  --card:#FFFFFF;
  --text:#4A3E3E;
  --accent:#C2A38E;
  --soft:#E8DCD3;
}

body{
  margin:0;
  background:var(--bg);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial;
  color:var(--text);
}

.wrapper{max-width:420px;margin:40px auto;padding:0 16px;}
.card{
  background:var(--card);
  border-radius:20px;
  padding:30px 26px 32px;
  box-shadow:0 16px 36px rgba(0,0,0,.08);
}

.brand{text-align:center;margin-bottom:12px;}
.brand img{
  width:120px;
  animation:float 4.5s ease-in-out infinite;
}
@keyframes float{
  0%{transform:translateY(0);opacity:.85;}
  50%{transform:translateY(-6px);opacity:1;}
  100%{transform:translateY(0);opacity:.85;}
}

h1{text-align:center;font-size:1.25rem;margin-bottom:24px;}

label{font-size:.82rem;display:block;margin-bottom:6px;}
input,select{
  width:100%;padding:14px 16px;border-radius:14px;
  border:1px solid #ddd;margin-bottom:18px;
}

button{
  width:100%;padding:16px;border:none;border-radius:18px;
  background:var(--accent);color:#fff;font-weight:600;
}

.result{text-align:center;display:none;margin-top:26px;}
.ntd{font-size:2.2rem;font-weight:700;}
.usd{font-size:.9rem;opacity:.65;}

.disclaimer{
  margin-top:28px;font-size:.75rem;line-height:1.55;
  color:#7A6A6A;border-top:1px solid var(--soft);padding-top:14px;
}

/* Modal */
.modal{
  position:fixed;inset:0;background:rgba(0,0,0,.35);
  display:none;align-items:center;justify-content:center;
}
.modal-box{
  background:#fff;border-radius:18px;padding:22px 20px;
  max-width:300px;text-align:center;
}
.modal-box button{margin-top:12px;}
</style>
</head>

<body>
<div class="wrapper">
<div class="card">

<div class="brand"><img src="logo.PNG" alt="brand"></div>

<h1>INTERNATIONAL AESTHETICS<br>國際美學精品委任報價</h1>

<label>商品名稱</label>
<input id="item" placeholder="例：限定色奶茶杯">

<label>海外採購參考金額（USD）</label>
<input id="usd" type="number" placeholder="僅作國際價格參考">

<label>採購來源（內部）</label>
<select id="src">
  <option value="official">官網 / 官方</option>
  <option value="relative">親戚 / 熟人</option>
  <option value="risk">非固定來源</option>
</select>

<label>運費（USD，可選）</label>
<input id="shipping" type="number" placeholder="例：10">

<label>關稅 / 手續費（USD，可選）</label>
<input id="customs" type="number" placeholder="例：5">

<button id="calcBtn">產生專屬報價</button>

<div class="result" id="result">
  <div class="ntd" id="ntd">NT$ 0</div>
  <div class="usd" id="usdShow">USD 0</div>
</div>

<div class="disclaimer" id="disclaimer"></div>

</div>
</div>

<div class="modal" id="modal">
  <div class="modal-box">
    ✨ 感謝您欣賞獨到的眼光<br>
    期待為您提供專屬的美學委任服務
    <button id="modalClose">確認</button>
  </div>
</div>

<script>
/* ===== 設定 ===== */
const CONFIG = {
  exchangeRate: 33.5,   // USD → TWD 參考匯率
  multiplier: {          // 原本來源倍率，可保留參考
    official: 1.8,
    relative: 1.95,
    risk: 2.1
  },
  disclaimerText: `
本報價為國際委任服務之統整金額，已包含合理服務成本與風險評估。<br>
海外商品來源、價格波動、物流與通關風險，皆屬委任評估範圍。<br>
本公司不涉及商品販售，僅提供委任代訂與顧問勞務。<br>
【國際代購委任聲明】<br>
委任商品限於個人自用，支付款項後即進入國際採購流程，恕不接受取消訂單或退費。
`
};

/* ===== 核心邏輯 ===== */
document.getElementById("disclaimer").innerHTML = CONFIG.disclaimerText;

document.getElementById("calcBtn").addEventListener("click", () => {
  const usd = parseFloat(document.getElementById("usd").value);
  if(!usd) return;

  const src = document.getElementById("src").value;
  const m = CONFIG.multiplier[src]; // 可保留參考倍率

  const shipping = parseFloat(document.getElementById("shipping").value) || 0;
  const customs = parseFloat(document.getElementById("customs").value) || 0;

  // 新公式：乘 1.5 + 運費 + 關稅
  const customerUSD = usd * 1.5 + shipping + customs;
  const ntd = Math.ceil(customerUSD * CONFIG.exchangeRate);

  document.getElementById("ntd").innerText = "NT$ " + ntd.toLocaleString();
  document.getElementById("usdShow").innerText = "USD " + customerUSD.toLocaleString();
  document.getElementById("result").style.display = "block";

  if(!sessionStorage.getItem("greeted")){
    document.getElementById("modal").style.display = "flex";
    sessionStorage.setItem("greeted","1");
  }
});

document.getElementById("modalClose").addEventListener("click", ()=>{
  document.getElementById("modal").style.display="none";
});
</script>
</body>
</html>
